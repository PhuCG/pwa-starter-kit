<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover exposes env(safe-area-inset-*); interactive-widget
         resizes the layout for the keyboard on Android (iOS is handled in
         src/pwa/viewportInsets.ts, which measures instead). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Starter" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link
      rel="preload"
      href="/fonts/PlusJakartaSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/PlusJakartaSans-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>PWA Starter</title>
    <!-- Resolve the colour scheme BEFORE the first paint. Without this the page
         renders light for as long as the JS bundle takes to arrive, and a dark-
         mode user gets a white flash on every cold start. Deliberately inline
         and dependency-free: a deferred or imported script is already too late.
         Mirrors resolveTheme() in src/lib/theme.ts — `npm run init` rewrites the
         storage key and both colours here, so never edit them by hand.

         This sets theme-color too, rather than declaring the usual pair of
         media-scoped <meta name="theme-color" media="(prefers-color-scheme:…)">
         tags. That pair is purely declarative and needs no script, but it can
         only ever follow the OS — it has no way to honour a user who picked the
         opposite theme in-app. One tag written from the same resolved value is
         correct in both cases, and on an installed PWA that value is the colour
         of the status bar and the task-switcher card. -->
    <script>
      (function () {
        var dark = false
        try {
          var saved = localStorage.getItem('app_v1_theme')
          dark =
            saved === 'dark' ||
            ((!saved || saved === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          /* storage blocked — fall through to light */
        }
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0b1120' : '#4f46e5')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
